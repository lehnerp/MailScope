<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MailScope{% endblock %}</title>
  <meta name="color-scheme" content="light dark">
  <script src="{{ url_for('static', filename='theme.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23101418'/><path d='M7 11l9 6 9-6M7 10h18v13H7z' fill='none' stroke='%23e8b34a' stroke-width='2'/></svg>">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{{ url_for('index') }}">
    <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><path d="M5 10l11 7 11-7M5 9h22v15H5z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>
    MailScope
  </a>
  <form class="pivot" action="{{ url_for('search') }}" method="get">
    <input name="q" placeholder="Pivot on IOC — IP, domain, hash, address…" value="{{ request.args.get('q','') if request.endpoint=='search' else '' }}" autocomplete="off">
  </form>
  <span class="ver">v{{ version }} · local</span>
  <div class="theme-toggle" role="group" aria-label="Colour theme">
    <button type="button" data-theme-set="auto" title="Auto (follow system)" aria-label="Auto theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
    </button>
    <button type="button" data-theme-set="light" title="Light" aria-label="Light theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button type="button" data-theme-set="dark" title="Dark" aria-label="Dark theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
  </div>
</header>
<main class="wrap">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash flash-{{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
